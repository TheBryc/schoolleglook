<style>
:root{
  --sky:#CFEAF6; --paper:#FFFFFF; --ink:#18224A; --muted:#4A5578; --line:#18224A; --hard:#18224A;
  --sun:#FFC633; --sun-ink:#18224A; --tomato:#E5482F; --grass:#2E9E6B; --plum:#6B46A8; --soft:#EEF7FB;
  --display:"Shrikhand", "Cooper Black", Georgia, serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#0F1733; --paper:#1A2550; --ink:#EAF0FF; --muted:#A9B4D6; --line:#8FA3E0; --hard:#04081A;
    --sun:#FFCF4D; --sun-ink:#18224A; --tomato:#FF6A4D; --grass:#48C08A; --plum:#A88BE0; --soft:#22305F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --sky:#0F1733; --paper:#1A2550; --ink:#EAF0FF; --muted:#A9B4D6; --line:#8FA3E0; --hard:#04081A;
  --sun:#FFCF4D; --sun-ink:#18224A; --tomato:#FF6A4D; --grass:#48C08A; --plum:#A88BE0; --soft:#22305F;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:calc(env(safe-area-inset-top, 0px) + 80px)}
body{margin:0; min-height:100%; background:var(--sky); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.5}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--paper)}
a{color:inherit; text-underline-offset:3px}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--tomato); outline-offset:2px}
.wrap{max-width:1180px; margin:0 auto; padding:0 18px}
h1,h2,h3{font-family:var(--display); font-weight:400; line-height:1.1; margin:0}
h2{font-size:clamp(28px,4vw,40px)} h3{font-size:22px}
p{margin:.4em 0}

/* header */
header.top{position:sticky; top:env(safe-area-inset-top, 0px); z-index:20; background:var(--paper); border-bottom:3px solid var(--line)}
.topbar{display:flex; align-items:center; gap:14px; padding:10px 0; flex-wrap:wrap}
.brand{font-family:var(--display); font-size:24px; white-space:nowrap}
nav.tabs{display:flex; gap:6px; overflow-x:auto; flex:1; scrollbar-width:none}
nav.tabs button{border:2.5px solid var(--line); background:var(--paper); border-radius:999px; padding:6px 14px; cursor:pointer; white-space:nowrap; font-weight:700}
nav.tabs button[aria-current="true"]{background:var(--sun); color:var(--sun-ink); box-shadow:3px 3px 0 var(--hard)}
.sync{font-size:13px; color:var(--muted); white-space:nowrap}

/* blocks */
.panel{background:var(--paper); border:3px solid var(--line); border-radius:22px; box-shadow:6px 6px 0 var(--hard); padding:22px}
.grid{display:grid; gap:22px}
.btn{border:2.5px solid var(--line); background:var(--sun); color:var(--sun-ink); border-radius:14px; padding:9px 16px; font-weight:700; cursor:pointer; box-shadow:3px 3px 0 var(--hard)}
.btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--hard)}
.btn.ghost{background:var(--paper); color:var(--ink)}
.btn.red{background:var(--tomato); color:#fff}
.btn:disabled{opacity:.5; cursor:not-allowed}
.chip{display:inline-block; border:2px solid var(--line); border-radius:999px; padding:1px 10px; font-size:13px; font-weight:700; background:var(--soft); margin:2px 4px 2px 0}
.chip.money{background:var(--grass); color:#fff; border-color:var(--grass)}
.chip.avoid{background:var(--tomato); color:#fff; border-color:var(--tomato)}
.chip.cold{background:var(--tomato); color:#fff; border-color:var(--tomato)}
.chip.warm{background:var(--sun); color:var(--sun-ink)}
.muted{color:var(--muted)}
.small{font-size:14px}
.banner{margin:18px 0; padding:12px 16px; border:2.5px dashed var(--line); border-radius:14px; background:var(--soft)}
section.view{padding:28px 0 60px}
.section-head{display:flex; align-items:end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px}

/* hero */
.hero{display:grid; grid-template-columns:1.3fr .7fr; gap:22px; align-items:stretch}
.hero h1{font-size:clamp(40px,7vw,78px)}
.count{display:flex; gap:14px; flex-wrap:wrap; margin-top:16px}
.count .box{border:3px solid var(--line); border-radius:18px; padding:10px 16px; background:var(--soft); min-width:140px}
.count .num{font-family:var(--display); font-size:40px; line-height:1}
.tower-wrap{display:flex; flex-direction:column; align-items:center; justify-content:end; text-align:center}
.tower-wrap svg{width:100%; max-width:230px; height:auto}
.floor{fill:var(--paper); stroke:var(--line); stroke-width:1.5}
.floor.on{fill:var(--sun)}
.building{fill:var(--paper); stroke:var(--line); stroke-width:3}
@media (prefers-reduced-motion:no-preference){ .floor.on{animation:pop .4s both} @keyframes pop{from{fill:var(--paper)}} }

.list{list-style:none; margin:0; padding:0}
.list li{display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-bottom:2px dotted var(--line)}
.list li:last-child{border-bottom:0}
.when{font-weight:700; min-width:84px}
.when.late{color:var(--tomato)}

.leader li{align-items:center}
.leader .bar{flex:1; height:16px; border:2px solid var(--line); border-radius:999px; overflow:hidden; background:var(--soft)}
.leader .bar span{display:block; height:100%; background:var(--grass)}

/* delegation */
.filters{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px}
.filters button{border:2px solid var(--line); background:var(--paper); border-radius:999px; padding:5px 12px; cursor:pointer; font-weight:700}
.filters button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.filters input{border:2.5px solid var(--line); border-radius:12px; padding:6px 12px; background:var(--paper); min-width:200px}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:20px}
.card{text-align:left; background:var(--paper); border:3px solid var(--line); border-radius:20px; box-shadow:5px 5px 0 var(--hard); padding:16px; cursor:pointer; display:flex; flex-direction:column; gap:8px}
.card:hover{transform:translate(-1px,-1px); box-shadow:7px 7px 0 var(--hard)}
.card.avoid{border-style:dashed}
.who{display:flex; gap:12px; align-items:center}
.avatar{width:64px; height:64px; border-radius:50%; border:3px solid var(--line); flex:none; display:grid; place-items:center; font-family:var(--display); font-size:24px; overflow:hidden; background:var(--sun); color:var(--sun-ink)}
.avatar.senate{background:var(--plum); color:#fff}
.avatar img{width:100%; height:100%; object-fit:cover}
.avatar.big{width:96px; height:96px; font-size:36px}
.name{font-weight:700; font-size:18px; line-height:1.2}
.stars{font-size:18px; letter-spacing:2px; color:var(--sun)}
.stars .off{color:var(--muted); opacity:.45}
.lvl{font-size:13px; font-weight:700}
.note{font-size:14px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}

/* drawer */
dialog{border:3px solid var(--line); border-radius:24px; box-shadow:8px 8px 0 var(--hard); padding:0; background:var(--paper); color:var(--ink); width:min(760px,94vw); max-height:90vh}
dialog::backdrop{background:rgba(10,15,40,.55)}
.dlg{padding:22px; overflow:auto; max-height:90vh}
.dlg-head{display:flex; gap:16px; align-items:center; margin-bottom:12px}
.close{margin-left:auto}
.fields{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.fields .full{grid-column:1/-1}
label.f{display:flex; flex-direction:column; gap:4px; font-weight:700; font-size:14px}
label.f input,label.f select,label.f textarea{border:2.5px solid var(--line); border-radius:10px; padding:8px 10px; background:var(--paper); font-weight:400; font-size:16px}
label.f textarea{min-height:70px; resize:vertical}
.kv{display:grid; grid-template-columns:140px 1fr; gap:4px 12px; font-size:15px}
.kv dt{font-weight:700}
.kv dd{margin:0}
.know{background:var(--soft); border:2px solid var(--line); border-radius:14px; padding:12px 14px; margin:10px 0}

/* timeline */
.tl{position:relative; margin-left:14px; border-left:4px solid var(--line); padding-left:26px}
.tl .month{font-family:var(--display); font-size:24px; margin:24px 0 8px -40px; background:var(--sky); display:inline-block; padding:0 8px}
.ev{position:relative; margin:10px 0; padding:12px 14px; background:var(--paper); border:2.5px solid var(--line); border-radius:14px}
.ev::before{content:""; position:absolute; left:-39px; top:14px; width:18px; height:18px; border-radius:50%; border:3px solid var(--line); background:var(--paper)}
.ev.deadline::before{background:var(--tomato)} .ev.session::before{background:var(--sun)} .ev.election::before{background:var(--plum)} .ev.touch::before{background:var(--grass); width:14px; height:14px; left:-37px}
.ev.past{opacity:.6}
.ev.touch{border-style:dotted}
.today{margin:16px 0 16px -44px; display:flex; align-items:center; gap:10px; font-weight:700; color:var(--tomato)}
.today::before{content:""; width:22px; height:22px; border-radius:50%; background:var(--tomato); border:3px solid var(--line)}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:14px; margin-bottom:10px}
.legend span::before{content:""; display:inline-block; width:12px; height:12px; border-radius:50%; border:2px solid var(--line); margin-right:6px; vertical-align:-1px}
.legend .d::before{background:var(--tomato)} .legend .s::before{background:var(--sun)} .legend .e::before{background:var(--plum)} .legend .t::before{background:var(--grass)} .legend .m::before{background:var(--paper)}

/* calculator */
.calc{display:grid; grid-template-columns:1.4fr .6fr; gap:22px; align-items:start}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse; width:100%; min-width:640px}
th,td{padding:10px 8px; border-bottom:2px dotted var(--line); text-align:left; vertical-align:top; font-size:15px}
th{font-size:14px}
td input[type=number]{width:120px; border:2.5px solid var(--line); border-radius:10px; padding:6px 8px; background:var(--paper)}
td input[type=checkbox]{width:22px; height:22px; accent-color:var(--grass)}
.elig{font-weight:700; font-size:13px; border-radius:8px; padding:2px 8px; border:2px solid var(--line); white-space:nowrap}
.elig.ok{background:var(--grass); color:#fff; border-color:var(--grass)}
.elig.maybe{background:var(--sun); color:var(--sun-ink)}
.elig.no{background:var(--tomato); color:#fff; border-color:var(--tomato)}
.sum dl{display:grid; grid-template-columns:1fr auto; gap:8px 12px; margin:0}
.sum dt{font-weight:400} .sum dd{margin:0; font-weight:700; text-align:right}
.sum .big{font-family:var(--display); font-size:34px}
.meter{height:26px; border:3px solid var(--line); border-radius:999px; overflow:hidden; background:var(--soft); margin:10px 0}
.meter span{display:block; height:100%; background:var(--grass); transition:width .3s}
.meter.over span{background:var(--sun)}
.rowline{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.rowline input{width:130px; border:2.5px solid var(--line); border-radius:10px; padding:6px 8px; background:var(--paper)}

/* bills */
.steps{display:flex; gap:0; overflow-x:auto; padding:6px 2px 10px}
.step{flex:1 0 110px; text-align:center; font-size:13px; font-weight:700; position:relative; cursor:pointer; background:none; border:0; padding:0 4px}
.step .dot{width:30px; height:30px; margin:0 auto 6px; border-radius:50%; border:3px solid var(--line); background:var(--paper); display:grid; place-items:center; font-size:13px}
.step.done .dot{background:var(--grass); color:#fff}
.step.cur .dot{background:var(--sun); color:var(--sun-ink); box-shadow:0 0 0 4px var(--soft)}
.step::after{content:""; position:absolute; top:14px; left:calc(50% + 16px); right:calc(-50% + 16px); height:3px; background:var(--line)}
.step:last-child::after{display:none}

/* how it works */
.buckets{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:20px}
.bucket h3{margin-bottom:6px}
.bucket .tag{font-family:var(--display); font-size:44px; line-height:1}
ol.path{counter-reset:s; list-style:none; padding:0; margin:0; display:grid; gap:12px}
ol.path li{counter-increment:s; display:grid; grid-template-columns:52px 1fr; gap:12px; align-items:start}
ol.path li::before{content:counter(s); font-family:var(--display); font-size:26px; width:46px; height:46px; border-radius:50%; border:3px solid var(--line); display:grid; place-items:center; background:var(--sun); color:var(--sun-ink)}
.rules li{margin:6px 0}
.gloss{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px}
.gloss div{border:2px solid var(--line); border-radius:12px; padding:10px 12px; background:var(--soft)}
.links a{display:block; padding:6px 0}

.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:14px; font-weight:700; z-index:50; display:none}
.empty{padding:24px; text-align:center; border:2.5px dashed var(--line); border-radius:16px}

@media (max-width:860px){
  nav.tabs{order:3; flex-basis:100%}
  .sync{margin-left:auto}
  .hero,.calc{grid-template-columns:1fr}
  .fields{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
  .tower-wrap svg{max-width:170px}
}
.todo li{align-items:flex-start}
.todo input[type=checkbox]{width:22px;height:22px;margin-top:2px;accent-color:var(--grass);flex:none}
.todo .done-t{text-decoration:line-through;color:var(--muted)}
.todo-add{display:grid;grid-template-columns:1fr 160px 150px auto;gap:8px;margin:10px 0 4px}
.todo-add input{border:2.5px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--paper)}
@media (max-width:860px){.todo-add{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap topbar">
    <div class="brand">BRYC at the Capitol</div>
    <nav class="tabs" aria-label="Sections">
      <button data-tab="home">This week</button>
      <button data-tab="delegation">Delegation</button>
      <button data-tab="timeline">Timeline</button>
      <button data-tab="calc">Capital outlay calculator</button>
      <button data-tab="bills">Bill tracker</button>
      <button data-tab="how">How it works</button>
    </nav>
    <span class="sync" id="sync">Connecting…</span>
  </div>
</header>
<main class="wrap" id="main"></main>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
// ---------- constants ----------
const STATUSES=["Not contacted","Outreach sent","Met","Follow-up sent","Ally","Committed to support","Letter of support received","Declined"];
const LEVEL={"Not contacted":0,"Outreach sent":1,"Met":2,"Follow-up sent":2,"Ally":3,"Committed to support":4,"Letter of support received":5,"Declined":0};
const LEVEL_NAME=["Haven’t met","Reached out","Met","Ally","Committed","Champion"];
const TYPES={"Text/email":1,"Call":2,"Conversation":2,"Event":3,"Meeting":5,"Meal":5,"Site visit":8,"Letter of support":10,"Commitment":15};
const ASKS=["","Lead champion","Support","Not asking","Asked – yes","Asked – no"];
const STAGES=["Not filed","Filed","House committee","House floor","Senate committee","Senate floor","Final deal","Governor","Law (Act)"];
const LINE=["Not in bill yet","In bill","Amended up","Amended down","Cut","Final"];
const FLOORS=34, PTS_PER_FLOOR=5;
const SUBMIT=new Date(2026,9,30), SESSION=new Date(2027,3,12);
const DEFAULT_CALC={target:500000,planningPct:.10,miscPct:.10,matchPct:.25,items:[]};

// ---------- state ----------
const S={legs:{},tps:{},ms:{},bills:{},calc:null,loaded:{legs:false,tps:false,ms:false,bills:false,calc:false,tasks:false},
  tab:"home",filter:"capital",q:"",sort:"priority",db:null,assets:null,readOnly:false,dbMissing:false};
let calcLocal=null, calcTimer=null;

// ---------- helpers ----------
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+Math.round(Number(n)||0).toLocaleString("en-US");
const pd=s=>{ if(!s) return null; const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s); return m?new Date(+m[1],+m[2]-1,+m[3]):null; };
const today=()=>{const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate());};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const days=(a,b)=>Math.round((b-a)/86400000);
const fmt=s=>{const d=pd(s); return d?d.toLocaleDateString("en-US",{month:"short",day:"numeric"}):"No date";};
const initials=n=>/^VACANT/.test(n||"")?"14":(n||"?").replace(/^(Sen\.|Rep\.)\s*/,"").split(/\s+/).filter(w=>/^[A-Z]/.test(w)).slice(0,2).map(w=>w[0]).join("")||"?";
function toast(msg){const t=$("#toast"); t.textContent=msg; t.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display="none",2600);}
function people(who){return String(who||"").split(/,|&| and /).map(s=>s.trim()).filter(Boolean);}
function lastContact(id){let best=null; for(const t of Object.values(S.tps)){ if(t.legId===id){const d=pd(t.date); if(d&&(!best||d>best)) best=d;} } return best;}
function points(){let total=0; const by={}; for(const t of Object.values(S.tps)){ const p=TYPES[t.type]||1; total+=p; for(const w of people(t.who)){ if(/broadwater|alum/i.test(w)) continue; by[w]=(by[w]||0)+p; } } return {total,by};}
function sources(){const set=new Set(["Josh","Lucas","Elin","Logan Anderson","Chris Broadwater"]); for(const l of Object.values(S.legs)) for(const n of (l.notes||[])) if(n.source) set.add(n.source); return [...set].sort();}
const FIELD_LABELS={status:"status",owner:"owner",nextStep:"next step",nextDue:"next step due",askCO:"capital outlay role",askSupp:"$1.2M ask role",why:"why they matter",connection:"how we know them",fellowsLive:"Fellows who live here",fellowsSchool:"Fellows who attend school here",schoolsInDistrict:"schools",grades:"Fellows by grade",topSchools:"top schools"};
function clip(t,n){ t=String(t||""); return t.length>n?t.slice(0,n-1)+"…":t; }
function legName(id){ const l=S.legs[id]; return l?title(l):""; }
async function logActivity(text,legId,extra){ if(!S.db) return; try{ await S.db.collection("activity").doc().set(Object.assign({at:new Date().toISOString(),by:S.userName||"Someone",text,legId:legId||"",kind:"other"},extra||{})); }catch(_){} }
function ago(isoStr){ const d=new Date(isoStr); if(isNaN(d)) return ""; const m=Math.round((Date.now()-d)/60000); if(m<1) return "just now"; if(m<60) return m+" min ago"; const h=Math.round(m/60); if(h<24) return h+(h===1?" hour ago":" hours ago"); const dd=Math.round(h/24); if(dd<7) return dd+(dd===1?" day ago":" days ago"); return d.toLocaleDateString("en-US",{month:"short",day:"numeric"}); }
function activityList(items){ return `<ul class="list">${items.map(a=>`<li><span style="flex:1"><strong>${esc(a.by)}</strong> ${esc(a.text)}${a.legId&&S.legs[a.legId]?` <a href="#" data-open="${esc(a.legId)}">Open</a>`:""}</span><span class="small muted" style="white-space:nowrap">${esc(ago(a.at))}</span></li>`).join("")}</ul>`; }
function shrink(file){ return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{ const n=240, c=document.createElement("canvas"); c.width=n; c.height=n; const k=Math.max(n/img.width,n/img.height), w=img.width*k, h=img.height*k; c.getContext("2d").drawImage(img,(n-w)/2,(n-h)/4,w,h); res(c.toDataURL("image/jpeg",.82)); URL.revokeObjectURL(img.src); }; img.onerror=rej; img.src=URL.createObjectURL(file); }); }
function avatar(l,big){const cls="avatar"+(l.chamber==="Senate"?" senate":"")+(big?" big":""); return l.photo?`<span class="${cls}"><img alt="" src="${esc(l.photo)}"></span>`:l.photoId?`<span class="${cls}"><img alt="" src="/_blob/${esc(l.photoId)}"></span>`:`<span class="${cls}" aria-hidden="true">${esc(initials(l.name))}</span>`;}
function stars(lvl){let s=""; for(let i=1;i<=5;i++) s+= i<=lvl?"★":`<span class="off">★</span>`; return `<span class="stars" aria-label="${lvl} of 5 stars">${s}</span>`;}
function title(l){ if(l.district==="14"&&/VACANT/.test(l.name)) return "Senate District 14 (vacant)"; return (l.chamber==="Senate"?"Sen. ":"Rep. ")+l.name; }

async function write(ref,data,mode){
  if(!S.db){toast("Sign in to save changes."); return false;}
  if(S.readOnly){toast("You have view-only access."); return false;}
  try{ if(mode==="update") await ref.update(data); else await ref.set(data); return true; }
  catch(e){ if(e&&(e.code==="invalid_argument"||e.code==="permission-denied")){S.readOnly=true; toast("You have view-only access."); render();} else if(e&&e.code==="unavailable"){ try{await new Promise(r=>setTimeout(r,800+Math.random()*600)); if(mode==="update") await ref.update(data); else await ref.set(data); return true;}catch(_){toast("Couldn’t save. Try again in a moment.");} } else toast("Couldn’t save: "+(e&&e.message||"unknown error")); return false; }
}

function matches(id,l){
  const f=S.filter;
  if(f==="capital"&&l.region==="outside") return false;
  if(f==="outside"&&l.region!=="outside") return false;
  if(f==="list"&&(l.tier!=="1"||l.region==="outside")) return false;
  if(f==="money"&&!l.money) return false;
  if(f==="house"&&l.chamber!=="House") return false;
  if(f==="senate"&&l.chamber!=="Senate") return false;
  if(f==="avoid"&&l.tier!=="avoid") return false;
  if(f==="all"&&false) return false;
  if(S.q){ const q=S.q.toLowerCase(); if(!(l.name+" "+l.district+" "+l.parishes+" "+l.money+" "+l.committees+" "+(l.notes||[]).map(n=>n.text+" "+n.source).join(" ")).toLowerCase().includes(q)) return false; }
  return true;
}

function calcData(){ return calcLocal||S.calc||DEFAULT_CALC; }
function calcMath(c){
  const constr=c.items.filter(i=>i.include).reduce((s,i)=>s+(Number(i.cost)||0),0);
  const plan=constr*c.planningPct, misc=constr*c.miscPct, total=constr+plan+misc, match=total*c.matchPct, state=total-match;
  const needTotal=c.target/(1-c.matchPct), needConstr=needTotal/(1+c.planningPct+c.miscPct), needMatch=needTotal-c.target;
  const esc_on=c.escrow!==false;
  const escrow=t=>{ if(!esc_on||t<=0) return {up:0,yr:0,cap:0,years:0}; const up=t*.03, yr=t*.005, cap=Math.min(t*.10,1000000); return {up,yr,cap,years:Math.max(0,Math.ceil((cap-up)/yr))}; };
  const e=escrow(total), en=escrow(needTotal);
  return {constr,plan,misc,total,match,state,needTotal,needConstr,needMatch,e,en,esc_on};
}

function vHow(){

async function importNums(file){

}

  const row=([id,x])=>{ const d=pd(x.due); const late=!x.done&&d&&d<t;
    return `<li><input type="checkbox" data-task="${esc(id)}" ${x.done?"checked":""} ${S.readOnly||!S.db?"disabled":""} aria-label="Mark done: ${esc(x.title)}">
      <span style="flex:1"><span class="${x.done?"done-t":""}">${esc(x.title)}</span><br><span class="small muted">${x.owner?esc(x.owner):"No owner"}${x.done?` | Done${x.doneBy?" by "+esc(x.doneBy):""}${x.doneAt?" "+esc(ago(x.doneAt)):""}`:""}${x.note?` | ${esc(x.note)}`:""}</span></span>
      ${!x.done?`<span class="when ${late?"late":""}" style="min-width:70px;text-align:right">${x.due?fmt(x.due):"No date"}</span>`:""}
      ${!S.readOnly&&S.db?`<button class="btn ghost small" style="padding:2px 10px" data-edittask="${esc(id)}">Edit</button>`:""}</li>`; };
  return `<div class="panel" style="margin-top:22px">
    <div class="section-head" style="margin-bottom:4px"><h3>To-dos</h3><span class="filters" style="margin:0"><button data-todomine="0" aria-pressed="${!S.todoMine}">Everyone</button><button data-todomine="1" aria-pressed="${!!S.todoMine}">Mine</button></span></div>
    <p class="small muted">Check one off and the whole team sees it in Latest updates.</p>
    ${!S.readOnly&&S.db?`<div class="todo-add"><input id="tdTitle" placeholder="Add a to-do" aria-label="To-do"><input id="tdOwner" placeholder="Owner(s)" aria-label="Owner"><input type="date" id="tdDue" aria-label="Due date"><button class="btn" data-addtask>Add</button></div>`:""}
    ${open.length?`<ul class="list todo">${open.map(row).join("")}</ul>`:`<p class="muted">${S.todoMine?"Nothing on your plate.":"Everything’s done."}</p>`}
    ${done.length?`<details style="margin-top:8px"><summary class="small" style="cursor:pointer;font-weight:700">Done recently (${done.length})</summary><ul class="list todo">${done.map(row).join("")}</ul></details>`:""}
  </div>`;
}
function openEditTask(id){
  const x=S.tasks[id]; if(!x) return;
  body.innerHTML=`<div class="dlg-head"><h2 style="font-size:30px">Edit to-do</h2><button class="btn ghost close" data-close>Close</button></div>
  <div class="fields"><label class="f full">To-do<input id="etTitle" value="${esc(x.title)}"></label>
  <label class="f">Owner(s)<input id="etOwner" value="${esc(x.owner)}"></label><label class="f">Due<input type="date" id="etDue" value="${esc(x.due)}"></label>
  <label class="f full">Note<input id="etNote" value="${esc(x.note)}"></label></div>
  <p style="margin-top:16px;display:flex;gap:10px"><button class="btn" id="etSave">Save</button><button class="btn red" id="etDel">Delete</button></p>`;
  if(!dlg.open) dlg.showModal();
  $("#etSave").onclick=async()=>{ const t=$("#etTitle").value.trim(); if(!t){toast("Add the to-do text.");return;} if(await write(S.db.doc("tasks/"+id),{title:t,owner:$("#etOwner").value.trim(),due:$("#etDue").value,note:$("#etNote").value.trim()},"update")){ toast("Saved"); dlg.close(); logActivity(`edited the to-do “${clip(t,90)}”`); } };
  $("#etDel").onclick=async()=>{ if(!confirm("Delete this to-do?")) return; try{ await S.db.doc("tasks/"+id).delete(); toast("Deleted"); dlg.close(); logActivity(`deleted the to-do “${clip(x.title,90)}”`); }catch(_){ toast("Couldn’t delete it."); } };
}
function openAddMs(){
  if(S.readOnly||!S.db){ toast("Sign in to add dates."); return; }
  body.innerHTML=`<div class="dlg-head"><h2 style="font-size:30px">Add a date</h2><button class="btn ghost close" data-close>Close</button></div>
  <div class="fields"><label class="f">Date<input type="date" id="msDate"></label><label class="f">Kind<select id="msKind"><option value="milestone">Milestone</option><option value="deadline">Deadline</option><option value="session">Session</option><option value="election">Election</option></select></label>
  <label class="f full">Title<input id="msTitle"></label><label class="f full">Details<textarea id="msDet"></textarea></label></div>
  <p style="margin-top:16px"><button class="btn" id="msSave">Add to timeline</button></p>`;
  if(!dlg.open) dlg.showModal();
  $("#msSave").onclick=async()=>{ const d=$("#msDate").value,t=$("#msTitle").value.trim(); if(!d||!t){toast("Add a date and a title."); return;}
    const ok=await write(S.db.collection("milestones").doc(),{date:d,title:t,detail:$("#msDet").value.trim(),kind:$("#msKind").value,source:"Added by team"},"set"); if(ok){toast("Added to timeline"); dlg.close(); logActivity("added “"+clip(t,80)+"” to the timeline on "+fmt(d));} };
}

// ---------- events ----------
document.addEventListener("click",async e=>{
  const tgo=e.target.closest("[data-tab]"); if(tgo&&tgo.closest("nav")){ S.tab=tgo.dataset.tab; render(); window.scrollTo(0,0); return; }
  const tg=e.target.closest("[data-tab-go]"); if(tg){ S.tab=tg.dataset.tabGo; render(); window.scrollTo(0,0); return; }
  const op=e.target.closest("[data-open]"); if(op){ e.preventDefault(); openLeg(op.dataset.open); return; }
  const lg=e.target.closest("[data-log]"); if(lg){ openLog(lg.dataset.log); return; }
  if(e.target.closest("[data-close]")){ dlg.close(); return; }
  const fl=e.target.closest("[data-filter]"); if(fl){ S.filter=fl.dataset.filter; render(); return; }
  const dn=e.target.closest("[data-done]"); if(dn){ if(await write(S.db&&S.db.doc("touchpoints/"+dn.dataset.done),{done:true},"update")){ toast("Marked done"); const tp=S.tps[dn.dataset.done]||{}; logActivity("marked done: “"+clip(tp.followUp,100)+"”",tp.legId); } return; }
  const sv=e.target.closest("[data-saveleg]"); if(sv){ const id=sv.dataset.saveleg, upd={}; body.querySelectorAll("[data-lf]").forEach(el=>{ upd[el.dataset.lf]=el.value; }); sv.disabled=true; const old=S.legs[id]||{}; const changed=Object.keys(upd).filter(k=>String(old[k]??"")!==String(upd[k]??"")); if(!changed.length){ sv.disabled=false; toast("No changes to save"); return; } const ok=await write(S.db.doc("legislators/"+id),upd,"update"); sv.disabled=false; if(ok){ toast("Saved"); const parts=changed.slice(0,3).map(k=>k==="status"?`status to “${upd[k]}”`:k==="owner"?`owner to ${upd[k]||"nobody"}`:k==="nextStep"?`next step to “${clip(upd[k],80)}”`:(FIELD_LABELS[k]||k)); logActivity(`updated ${legName(id)}: ${parts.join(", ")}${changed.length>3?` and ${changed.length-3} more`:""}`,id); } return; }
  const st=e.target.closest("[data-stage]"); if(st){ const [id,ix]=st.dataset.stage.split(":"); if(await write(S.db&&S.db.doc("bills/"+id),{stage:+ix},"update")){ toast("Stage updated"); const b=S.bills[id]||{}; logActivity(`moved ${b.number||b.key||id} to “${STAGES[+ix]}”`); } return; }
  if(e.target.closest("[data-addms]")){ openAddMs(); return; }
  const tm=e.target.closest("[data-todomine]"); if(tm){ S.todoMine=tm.dataset.todomine==="1"; render(); return; }
  const et=e.target.closest("[data-edittask]"); if(et){ openEditTask(et.dataset.edittask); return; }
  if(e.target.closest("[data-addtask]")){ const t=$("#tdTitle").value.trim(); if(!t){ toast("Type the to-do first."); return; }
    const data={title:t,owner:$("#tdOwner").value.trim(),due:$("#tdDue").value,done:false,note:"",createdAt:new Date().toISOString(),createdBy:S.userName||""};
    if(await write(S.db.collection("tasks").doc(),data,"set")){ toast("To-do added"); logActivity(`added a to-do: “${clip(t,90)}”${data.owner?" ("+data.owner+")":""}`); } return; }
  if(e.target.closest("[data-seedtasks]")){ const b=S.db.batch(); STARTER_TASKS.forEach(x=>b.set(S.db.collection("tasks").doc(),{title:x.title,owner:x.owner,due:x.due,done:!!x.done,doneBy:x.doneBy||"",doneAt:x.done?new Date().toISOString():"",note:x.note||"",createdAt:new Date().toISOString(),createdBy:S.userName||""}));
    try{ await b.commit(); toast("Checklist added"); logActivity("added the Oct 30 submission checklist"); }catch(err){ toast("Couldn’t add the checklist."); } return; }
  const an=e.target.closest("[data-addnote]"); if(an){ const id=an.dataset.addnote; const text=$("#nText").value.trim(); if(!text){toast("Write the note first."); return;}
    const notes=[...(S.legs[id].notes||[]),{text,source:$("#nSrc").value.trim(),date:$("#nDate").value}];
    an.disabled=true; if(await write(S.db.doc("legislators/"+id),{notes},"update")){ toast("Note added"); setTimeout(()=>openLeg(id),300); const src=$("#nSrc").value.trim(); logActivity(`added a note on ${legName(id)}${src?" (from "+src+")":""}: “${clip(text,140)}”`,id);} an.disabled=false; return; }
  const dn2=e.target.closest("[data-delnote]"); if(dn2){ const [id,ix]=dn2.dataset.delnote.split(":"); if(!confirm("Delete this note?")) return; const notes=(S.legs[id].notes||[]).filter((_,i)=>i!==+ix);
    if(await write(S.db.doc("legislators/"+id),{notes},"update")){ toast("Note deleted"); setTimeout(()=>openLeg(id),300); logActivity("deleted a note on "+legName(id),id);} return; }
  if(e.target.closest("[data-addleg]")){ openAddLeg(); return; }
  if(e.target.closest("[data-signin]")){ signIn(); return; }
  if(e.target.closest("[data-signout]")){ firebase.auth().signOut(); return; }
  const dm=e.target.closest("[data-delms]"); if(dm){ if(!confirm("Remove this date from the timeline?")) return; try{ const m=S.ms[dm.dataset.delms]||{}; await S.db.doc("milestones/"+dm.dataset.delms).delete(); toast("Removed"); logActivity("removed “"+clip(m.title,80)+"” from the timeline"); }catch(_){ toast("Couldn’t remove it."); } return; }
  if(e.target.id==="addItem"){ const n=$("#newItem").value.trim(); if(!n) return; calcLocal=JSON.parse(JSON.stringify(calcData())); calcLocal.items.push({id:"u"+Date.now(),name:n,eligibility:"Check",rule:"Confirm with Chris or FP&C",proof:"",cost:0,include:true,note:""}); doRender(); saveCalcSoon(); return; }
});
dlg.addEventListener("click",e=>{ if(e.target===dlg) dlg.close(); });
document.addEventListener("input",e=>{
  if(e.target.id==="q"){ S.q=e.target.value; const pos=e.target.selectionStart; doRender(); const q=$("#q"); q.focus(); q.setSelectionRange(pos,pos); return; }
  const ci=e.target.dataset&&e.target.dataset.ci; if(ci!=null){ calcLocal=JSON.parse(JSON.stringify(calcData())); const it=calcLocal.items[+ci]; if(e.target.dataset.cf==="include") it.include=e.target.checked; else it.cost=Math.max(0,Number(e.target.value)||0); updateCalcOut(); saveCalcSoon(); return; }
  if(e.target.id==="escrowOn"){ calcLocal=JSON.parse(JSON.stringify(calcData())); calcLocal.escrow=e.target.checked; updateCalcOut(); saveCalcSoon(); return; }
  if(e.target.id==="target"){ calcLocal=JSON.parse(JSON.stringify(calcData())); calcLocal.target=Math.max(0,Number(e.target.value)||0); updateCalcOut(); saveCalcSoon(); }
});
document.addEventListener("change",async e=>{
  if(e.target.id==="sort"){ S.sort=e.target.value; render(); return; }
  const tk=e.target.dataset&&e.target.dataset.task; if(tk){ const x=S.tasks[tk]||{}; const done=e.target.checked;
    if(await write(S.db.doc("tasks/"+tk),done?{done:true,doneBy:S.userName||"",doneAt:new Date().toISOString()}:{done:false,doneBy:"",doneAt:""},"update")){ toast(done?"Done":"Reopened"); logActivity(`${done?"completed":"reopened"} “${clip(x.title,100)}”`,"",{kind:done?"task_done":"task_reopened",title:x.title||""}); } return; }
  if(e.target.id==="seedFile"){ const f=e.target.files[0]; e.target.value=""; if(f) importSeed(f); return; }
  if(e.target.id==="importNums"){ const f=e.target.files[0]; e.target.value=""; if(f) importNums(f); return; }
  const bf=e.target.dataset&&e.target.dataset.bf; if(bf){ const [id,k]=bf.split(":"); if(await write(S.db&&S.db.doc("bills/"+id),{[k]:e.target.value},"update")){ toast("Saved"); const b=S.bills[id]||{}; logActivity(`updated ${b.number||b.key||id}: ${k==="line"?"BRYC line item":k} to “${clip(e.target.value,60)}”`); } }
});

// ---------- boot ----------
render();
async function importSeed(file){
  let d; try{ d=JSON.parse(await file.text()); }catch(_){ toast("That isn’t the starting data file."); return; }
  if(!d||!d.legs){ toast("That isn’t the starting data file."); return; }
  const fs=S.db, ops=[];
  for(const [col,key] of [["legislators","legs"],["touchpoints","tps"],["milestones","ms"],["bills","bills"]]) for(const [id,v] of Object.entries(d[key]||{})) ops.push([fs.collection(col).doc(id),v]);
  if(d.calc) ops.push([fs.doc("settings/calc"),d.calc]);
  toast("Loading starting data…");
  try{ for(let k=0;k<ops.length;k+=400){ const b=fs.batch(); ops.slice(k,k+400).forEach(([r,v])=>b.set(r,v)); await b.commit(); } toast(`Loaded ${ops.length} records`); }
  catch(e){ toast("Couldn’t load: "+(e&&e.message||"error")); }
}
async function signIn(){
  const p=new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({hd:window.ALLOWED_DOMAIN, prompt:"select_account"});
  try{ await firebase.auth().signInWithPopup(p); }catch(e){ S.authError=e&&e.message||"Sign-in failed"; render(); }
}
(async()=>{
  const cfg=window.FIREBASE_CONFIG||{};
  if(!window.firebase||!cfg.apiKey||/^PASTE/.test(cfg.apiKey)){ S.needSetup=true; $("#sync").textContent="Not set up"; render(); return; }
  firebase.initializeApp(cfg);
  const fs=firebase.firestore();
  let unsubs=[];
  firebase.auth().onAuthStateChanged(async u=>{
    unsubs.forEach(f=>f()); unsubs=[];
    const ok=u&&u.email&&u.email.toLowerCase().endsWith("@"+window.ALLOWED_DOMAIN.toLowerCase());
    if(u&&!ok){ S.authError=`${u.email} isn’t a @${window.ALLOWED_DOMAIN} account.`; await firebase.auth().signOut(); return; }
    if(!u){ S.needSignIn=true; S.db=null; Object.keys(S.loaded).forEach(k=>S.loaded[k]=false); $("#sync").innerHTML="Signed out"; render(); return; }
    S.needSignIn=false; S.authError=""; S.db=fs; S.assets={upload:true}; S.userName=(u.displayName||u.email||"").split(" ")[0]||u.email;
    $("#sync").innerHTML=`Live, ${esc(u.email)} <a href="#" data-signout>Sign out</a>`;
    const sub=(path,key)=>unsubs.push(fs.collection(path).onSnapshot(snap=>{ const o={}; snap.docs.forEach(d=>o[d.id]=d.data()); S[key]=o; S.loaded[key]=true; render(); },err=>{ if(err&&err.code==="permission-denied"){ S.readOnly=true; toast("This account can’t open the tracker."); } else $("#sync").textContent="Reconnecting…"; }));
    sub("legislators","legs"); sub("touchpoints","tps"); sub("milestones","ms"); sub("bills","bills"); sub("tasks","tasks");
    unsubs.push(fs.collection("activity").orderBy("at","desc").limit(300).onSnapshot(snap=>{ const o={}; snap.docs.forEach(d=>o[d.id]=d.data()); S.act=o; render(); },()=>{}));
    unsubs.push(fs.doc("settings/calc").onSnapshot(snap=>{ S.calc=snap.exists?snap.data():null; S.loaded.calc=true; render(); }));
  });
})();
})();
</script>
</body>
